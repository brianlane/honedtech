name: Prospector

# Automated outreach pipeline: discover prospects via Google Places, probe
# each site, compose drafts, and email a digest for manual review. Nothing is
# ever sent to a prospect by this workflow.
on:
  schedule:
    # 13:00 UTC on weekdays (6am Phoenix in summer), so the digest is waiting.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: Max new prospects to discover this run
        required: false
        default: "12"
      dry_run:
        description: Compose only, do not email or write the ledger
        type: boolean
        required: false
        default: false

concurrency:
  # Never let two runs discover against the same ledger snapshot.
  group: prospector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Discover, audit, compose, digest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
          OUTREACH_KV_NAMESPACE_ID: ${{ vars.OUTREACH_KV_NAMESPACE_ID }}
          DIGEST_URL: ${{ vars.DIGEST_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROSPECT_LIMIT: ${{ inputs.limit || '12' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npm run prospect:pipeline
