name: Enterprise Prospector

# Weekly Enterprise outreach pipeline: pull WARN Act layoff filings that have
# aged past the contact window, resolve each employer to a domain, read their
# public job board for stack overlap, rank, and email a digest of research
# briefs. Nothing is ever sent to a prospect by this workflow, and the drafts
# carry no recipient: the named executive is looked up by hand.
on:
  schedule:
    # 14:00 UTC Tuesdays (7am Phoenix in summer). Weekly, not daily, because
    # this motion is low volume and every account gets read before sending.
    - cron: "0 14 * * 2"
  workflow_dispatch:
    inputs:
      limit:
        description: Max accounts to work up this run
        required: false
        default: "6"
      states:
        description: Comma-separated state codes, blank for every covered state
        required: false
        default: ""
      dry_run:
        description: Research only, do not email or write the ledger
        type: boolean
        required: false
        default: false

concurrency:
  # Never let two runs work against the same ledger snapshot.
  group: enterprise-prospector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Signals, research, digest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
          WARN_API_KEY: ${{ secrets.WARN_API_KEY }}
          OUTREACH_KV_NAMESPACE_ID: ${{ vars.OUTREACH_KV_NAMESPACE_ID }}
          DIGEST_URL: ${{ vars.DIGEST_URL }}
          WARN_API_URL: ${{ vars.WARN_API_URL }}
          WARN_STATES: ${{ inputs.states || vars.WARN_STATES }}
          ENTERPRISE_LIMIT: ${{ inputs.limit || '6' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: npm run enterprise:pipeline
