version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check (latest: 0.9.9) peer-pins typescript to "^5.0.0 ||
      # ^6.0.0", so a TypeScript 7 bump breaks `npm ci` with ERESOLVE (see
      # PR #6). Unignore once @astrojs/check ships a release accepting TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
